model:
  base_model: models/qwen3_safety_merged_dpo_v1
  output_dir: models/qwen3_safety_dpo_v2

data:
  train_path: data/safety_dpo_v2.jsonl
  dev_path:

training:
  num_train_epochs: 2
  learning_rate: 0.000003
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_seq_length: 2048
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  seed: 42

dpo:
  beta: 0.05

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

wandb:
  project: cs552-safety-model
  entity: MNLP26
  run_name: dpo-v2-iterative-hardneg-1528-2ep
  tags:
    - safety
    - dpo
    - iterative
  notes: >
    DPO v2: iterative hard negatives only from dpo_v1 wrong predictions
    on safetybench_10k (1528 pairs). No augmentation.
    Base: qwen3_safety_merged_dpo_v1. beta=0.05, lr=3e-6, 2 epochs.
