model:
  base_model: Qwen/Qwen3-1.7B
  output_dir: models/exp4_clean_mix_wildguardmix_48k

data:
  train_path: data/exp4_clean_mix_wildguardmix_train.jsonl
  dev_path: data/exp4_clean_mix_wildguardmix_dev.jsonl

training:
  num_train_epochs: 1
  learning_rate: 0.000010          # 1e-5 — same as best v10
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16  # effective batch = 16
  max_seq_length: 2048
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

generation:
  max_new_tokens: 128
  do_sample: false

wandb:
  project: cs552-safety-model
  entity: MNLP26
  run_name: v16-wildguardmix-48k-r16-lr1e5
  tags:
    - safety
    - qwen3-1.7b
    - lora
    - combined-v16
    - wildguardmix
    - no-thinking
    - 48k-train
  notes: >
    v16: adds WildGuardMix (15k) + SafetyBench (6k) to the best v10 mix (84% CI).
    WildGuardMix + SafetyBench is the dataset combo used by mystery-machine team (88-90% CI).
    Reduces BBQ from 8k to 5k to avoid dilution.
    Direct-answer (no CoT) model — enable_thinking=true baked into template after merge.
    Qwen3 native thinking activates at CI inference without CoT training data.
