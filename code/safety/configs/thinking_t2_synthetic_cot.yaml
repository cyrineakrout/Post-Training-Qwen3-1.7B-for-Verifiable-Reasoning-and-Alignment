model:
  base_model: Qwen/Qwen3-1.7B
  output_dir: models/thinking_t2_synthetic_cot

data:
  train_path: data/combined_v13_thinking_train.jsonl
  dev_path:   data/combined_v13_thinking_dev.jsonl

training:
  num_train_epochs: 1
  learning_rate: 0.000010          # 1e-5 — proven best
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8   # effective batch = 16
  max_seq_length: 2048
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

generation:
  max_new_tokens: 1024             # longer budget for <think> blocks
  do_sample: false

wandb:
  project: cs552-safety-model
  entity: MNLP26
  run_name: v13-thinking-38k-r16-lr1e5
  tags:
    - safety
    - qwen3-1.7b
    - lora
    - combined-v13
    - thinking-on
    - real-cot
    - 38k-train
  notes: >
    v13: thinking mode ON with real reasoning traces.
    Converts v12 reasoning-format examples to <think>...</think>\boxed{X}.
    Skips BBQ/SALAD (bare \boxed{X}, no reasoning to wrap — avoids v11 empty-think failure).
    ~38k examples: BeaverTails 12k + HH-RLHF 8k + SIQA/ETHICS/Civil 18k.
    Top competitors (87%, 85%, 84%) all use thinking ON — this is the key differentiator.
